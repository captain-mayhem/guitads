-- Captain's Game Engine's configuration for guit3 (CGE: the window, the
-- graphics, the main loop). It is next to guit3's executable (or in the web
-- build's virtual file system); see guit3/guiengine.h.

-- init subsystems --
graphics = true
-- the folders for the engine's own user data; guit3 keeps its settings itself
appName = "guit3"

-- section window --
-- the window's contents in logical pixels (pixels at 96 DPI), scaled to the
-- screen's DPI; guit3 sets the size again when it creates its main window,
-- and shows the window then
width = 1426
height = 746
bitsPerPixel = 32
fullscreen = false
windowShown = false
-- the coordinate space of the engine's input events; guit3 reads its input
-- through ImGui, in window pixels
virtualWidth = 1426
virtualHeight = 746

-- section renderer --
renderer = "OpenGL"
maxFramerate = 0 -- frames per second at most, 0 means no limit besides vsync
vsync = true
updateRate = 60 -- calls of the application's update per second
