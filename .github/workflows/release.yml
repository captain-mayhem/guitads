name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (defaults to the ref this workflow runs on)'
        required: false
      draft:
        description: 'Create as a draft release (for testing, not publicly visible; also skips GitHub Pages)'
        type: boolean
        default: true
      pages_only:
        description: 'Only build the web version and deploy it to GitHub Pages - no release'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Everything for a release; just the web build for a Pages-only run.
        include: >-
          ${{ fromJSON(inputs.pages_only
          && '[{"os":"ubuntu-latest","preset":"emscripten","build_dir":"build/emscripten","artifact":"guitads-emscripten"}]'
          || '[{"os":"windows-latest","preset":"windows-only","build_dir":"build/default","artifact":"guitads-windows"},
          {"os":"ubuntu-latest","preset":"default","build_dir":"build/default","artifact":"guitads-linux"},
          {"os":"ubuntu-latest","preset":"emscripten","build_dir":"build/emscripten","artifact":"guitads-emscripten"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: guitads
      - name: Check the tag matches GUITADS_VERSION
        # The package is named after GUITADS_VERSION (CMakeLists.txt), so a
        # v<version> tag must carry the same version.
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          v=$(sed -n 's/^set(GUITADS_VERSION \([^ )]*\)).*/\1/p' guitads/CMakeLists.txt | tr -d '\r')
          if [ "${GITHUB_REF_NAME#v}" != "$v" ]; then
            echo "::error::tag $GITHUB_REF_NAME doesn't match GUITADS_VERSION $v in CMakeLists.txt"
            exit 1
          fi
      - name: Read pinned sibling commits
        id: pins
        # Only guitads is tagged: guitads/dependencies.txt pins the
        # tads-runner and captainsengine commits that belong to it
        # (cmake/GuitadsDeps.cmake), so rebuilding a tag rebuilds the same
        # sources.
        shell: bash
        run: sed -e 's/\r$//' -e '/^[[:space:]]*#/d' -e '/^[[:space:]]*$/d' guitads/dependencies.txt >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: captain-mayhem/tads-runner
          ref: ${{ steps.pins.outputs['tads-runner'] }}
          path: tads-runner
      - uses: actions/checkout@v7
        with:
          repository: captain-mayhem/captainsengine
          ref: ${{ steps.pins.outputs['captainsengine'] }}
          path: captainsengine
      - if: runner.os == 'Linux' && matrix.preset != 'emscripten'
        name: Install Linux build dependencies
        # Same package list as build.yml's native Linux job.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            libcurl4-openssl-dev \
            libfontconfig-dev \
            libgl1-mesa-dev \
            libegl-dev \
            libglu1-mesa-dev \
            libx11-dev \
            pkg-config
      - if: matrix.preset == 'emscripten'
        name: Install Emscripten build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build
      - if: matrix.preset == 'emscripten'
        name: Set up emsdk
        # Sets $EMSDK, which the emscripten preset's toolchain file path uses.
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: 4.0.22
      - run: cmake --preset ${{ matrix.preset }} -DCMAKE_BUILD_TYPE=Release -DGUITADS_REQUIRE_PINNED_DEPS=ON
        working-directory: tads-runner
      - run: cmake --build ${{ matrix.build_dir }} --config Release
        working-directory: tads-runner
      - name: Package
        # Only the guitads sibling is checked out, so this produces just the
        # GuiTads-<version>-<system>.zip (see tads-runner's CMakeLists.txt).
        working-directory: tads-runner/${{ matrix.build_dir }}
        run: cpack
      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: tads-runner/${{ matrix.build_dir }}/*.zip

  release:
    needs: build
    if: ${{ !inputs.pages_only }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft }}
          generate_release_notes: true
          files: dist/**/*.zip

  # The web build, as a GitHub Pages site: on a tag push, a manual non-draft
  # release, or a manual Pages-only run. Needs Settings > Pages > Source set
  # to "GitHub Actions", and the github-pages environment must allow the
  # v* tags (Settings > Environments) for tag pushes to deploy.
  pages:
    needs: build
    if: ${{ github.event_name == 'push' || inputs.pages_only || !inputs.draft }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: guitads-emscripten
          path: dist
      - name: Unpack the web build
        # The site is the GuiTads-<version>-Emscripten.zip's contents, with
        # guit3.html also as index.html. A project site lives under a
        # sub-path (/<repo>/), which the WebUI Service Worker handles, and
        # Pages can't send the COOP/COEP headers guit3 needs, which that
        # worker adds (see guit3/emscripten/guit3-webui-sw.js).
        run: |
          unzip -q dist/*.zip -d unpacked
          dir=$(dirname "$(find unpacked -name guit3.html | head -n 1)")
          mkdir site
          cp -r "$dir"/. site/
          cp site/guit3.html site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5
